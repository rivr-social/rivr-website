server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self'; frame-src https://api.mapbox.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;

  # Legacy Squarespace paths, kept in step with nginx.conf for rivr.social.
  location = /home { return 301 /; }
  location = /app { return 302 https://app.rivr.social/; }
  location = /context { return 301 /about; }
  location = /about4 { return 301 /about; }
  location = /featuresold { return 301 /features; }
  location = /team22 { return 301 /team; }
  location = /our-approach { return 301 /about; }
  location = /services { return 301 /features; }
  location = /begin-1 { return 301 /getstarted; }
  location ~ ^/home(-[1-5]|as)?$ { return 301 /; }
  location = /emailverification { return 301 /contact; }
  location = /delete-data { return 301 /privacy; }

  location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self'; frame-src https://api.mapbox.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;
  }

  # Extensionless page routes (/vision -> vision.html) and directory indexes.
  location / {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self'; frame-src https://api.mapbox.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self'; frame-src https://api.mapbox.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; font-src 'self'; frame-src https://api.mapbox.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:" always;
    try_files $uri =404;
  }

  location ~* \.(?:txt|xml)$ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
  }

  error_page 404 /404.html;
}
